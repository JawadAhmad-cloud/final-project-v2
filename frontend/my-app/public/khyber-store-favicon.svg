<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#7C3AED"/>
  
  <!-- Shopping bag shape -->
  <g transform="translate(100, 100)">
    <!-- Bag body -->
    <path d="M -35 -10 L -40 20 Q -40 35 -25 35 L 25 35 Q 40 35 40 20 L 35 -10 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    
    <!-- Bag handles -->
    <path d="M -20 -10 Q -20 -30 0 -35 Q 20 -30 20 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shopping cart inside -->
    <g transform="translate(0, 5)">
      <!-- Cart icon (simple) -->
      <circle cx="-8" cy="15" r="3" fill="#7C3AED"/>
      <circle cx="8" cy="15" r="3" fill="#7C3AED"/>
      <path d="M -15 5 L 15 5 L 12 15 L -12 15 Z" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
    </g>
    
    <!-- Decorative star (representing quality/premium) -->
    <g transform="translate(25, -20)">
      <path d="M 0 -6 L 1.5 -2 L 6 -2 L 2.5 1 L 4 6 L 0 3 L -4 6 L -2.5 1 L -6 -2 L -1.5 -2 Z" fill="#FCD34D"/>
    </g>
  </g>
</svg>